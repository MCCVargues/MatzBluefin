# Mac-style shortcuts: Super+<key> is sent as Ctrl+<key> for the keys below.
#
# niri cannot synthesise key presses, so keyd (which sits below the compositor)
# rewrites them before niri sees them. Super stays Super for everything else,
# so every other Mod+<key> niri bind is untouched. niri binds that used a
# remapped key were moved to make room: center-column Mod+C -> Mod+G, floating
# Mod+V -> Mod+B, clipboard history Mod+Shift+C -> Mod+Y, tabbed display
# Mod+W -> Mod+Semicolon, notification dismiss Mod+N -> Mod+BackSpace.
#
# Ctrl+Insert / Shift+Insert / Shift+Delete are the legacy copy / paste / cut
# chords rather than Ctrl+C/V/X: terminals (Ptyxis, VTE) treat Ctrl+C as
# SIGINT, but accept these for clipboard use, as do GTK, Qt, Firefox and
# Electron apps.

[ids]
*

[main]
leftmeta = layer(mac)
rightmeta = layer(mac)

# Layer "mac" sends Meta while held, so non-remapped combos reach niri as usual.
[mac:M]
c = C-insert
x = S-delete
v = S-insert
a = C-a
z = C-z
s = C-s
p = C-p
w = C-w
t = C-t
n = C-n

# With Shift also held: redo, and pass through the Mod+Shift binds niri still
# uses on remapped keys (Mod+Shift+W/N/P are not bound today, P is).
[mac+shift]
z = C-S-z
p = M-S-p
w = M-S-w
n = M-S-n
