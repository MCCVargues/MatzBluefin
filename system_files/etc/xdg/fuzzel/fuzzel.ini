# System-wide fuzzel (app launcher) config for the niri session.
# Per-user override: ~/.config/fuzzel/fuzzel.ini (see `ujust niri-config`).
# Reference: man 5 fuzzel.ini

font=JetBrains Mono:size=12
dpi-aware=no
prompt="  "
terminal=ptyxis --
layer=overlay
lines=12
width=48
horizontal-pad=20
vertical-pad=14
inner-pad=6

[colors]
background=1e1e2eee
text=cdd6f4ff
match=7fc8ffff
selection=313244ff
selection-text=cdd6f4ff
selection-match=7fc8ffff
border=7fc8ffff

[border]
width=2
radius=8

[key-bindings]
cancel=Escape Control+g
